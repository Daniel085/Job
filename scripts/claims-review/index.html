<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claims Review</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1f2328; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --pending: #b45309; --pending-bg: #fef3c7; --ok: #15803d; --ok-bg: #dcfce7;
    --bad: #b91c1c; --bad-bg: #fee2e2; --focus: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141517; --panel: #1c1d20; --ink: #e8e8e6; --muted: #9ca3af; --line: #2e3035;
      --accent: #60a5fa; --pending: #fbbf24; --pending-bg: #3a2e12; --ok: #4ade80; --ok-bg: #12301d;
      --bad: #f87171; --bad-bg: #3b1515; --focus: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  select, button, textarea { font: inherit; color: inherit; }
  select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  .counts { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.approve { color: var(--ok); }
  button.reject { color: var(--bad); }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); margin-left: 4px; }
  main { flex: 1; display: grid; grid-template-columns: minmax(340px, 38%) 1fr; min-height: 0; }
  #list { overflow-y: auto; padding: 12px; border-right: 1px solid var(--line); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; cursor: pointer; }
  .card.active { border-color: var(--focus); box-shadow: 0 0 0 2px color-mix(in srgb, var(--focus) 25%, transparent); }
  .card .top { display: flex; gap: 8px; align-items: baseline; }
  .card .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .card .label { font-weight: 600; flex: 1; }
  .chip { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; border-radius: 999px; padding: 1px 8px; }
  .chip.pending { background: var(--pending-bg); color: var(--pending); }
  .chip.approved, .chip.edited { background: var(--ok-bg); color: var(--ok); }
  .chip.rejected { background: var(--bad-bg); color: var(--bad); }
  .why { color: var(--muted); font-size: 12.5px; margin: 4px 0 6px; }
  .loc { border-left: 3px solid var(--line); padding: 2px 0 2px 8px; margin: 6px 0; }
  .loc .file { font-size: 11.5px; color: var(--muted); }
  .loc .file .missing { color: var(--bad); font-weight: 600; }
  .loc q { quotes: none; }
  .note { font-size: 12.5px; color: var(--muted); font-style: italic; }
  .nodoc { font-weight: 600; color: var(--pending); }
  #wraps { padding: 6px 12px; font-size: 12.5px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #wraps.ok { color: var(--ok); }
  #wraps.warn { color: var(--pending); }
  #wraps ul { margin: 4px 0 0 18px; padding: 0; color: var(--ink); }
  #nodoc { display: none; padding: 8px 12px; background: var(--pending-bg); color: var(--pending); font-size: 13px; border-bottom: 1px solid var(--line); }
  .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  textarea { width: 100%; min-height: 70px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px; resize: vertical; }
  .hist { font-size: 12px; color: var(--muted); margin-top: 6px; }
  #right { display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; gap: 4px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); background: var(--panel); }
  .tab { border: 1px solid var(--line); border-bottom: 0; border-radius: 6px 6px 0 0; padding: 5px 12px; cursor: pointer; background: var(--bg); }
  .tab.on { background: #fff; color: #1f2328; font-weight: 600; }
  iframe { flex: 1; border: 0; background: #fff; width: 100%; }
  #toast { position: fixed; right: 16px; bottom: 16px; max-width: 520px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.15); display: none; white-space: pre-wrap; }
  #toast.err { border-color: var(--bad); color: var(--bad); }
  .empty { color: var(--muted); padding: 24px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 50% 50%; } #list { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>Claims Review</h1>
  <select id="pkg"></select>
  <span class="counts" id="counts"></span>
  <span class="spacer"></span>
  <button id="approveAll" title="Approve every claim still pending">Approve all remaining</button>
  <button id="render" class="primary" title="Render the resume and letter PDFs">Render PDFs</button>
</header>
<main>
  <section id="list"></section>
  <section id="right">
    <div class="tabs" id="tabs"></div>
    <div id="wraps"></div>
    <div id="nodoc">The selected claim does not appear in the resume or the letter. It is a wording question for future packages.</div>
    <iframe id="frame" title="Document preview"></iframe>
  </section>
</main>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
let state = { pkg: null, data: null, active: null, file: null, editing: null };

function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', err ? 9000 : 4000);
}
async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

async function loadPackages() {
  const pk = await api('/api/packages');
  const sel = $('#pkg');
  if (!pk.length) { $('#list').innerHTML = '<div class="empty">No package has a claims.json yet.</div>'; return; }
  sel.innerHTML = pk.map(p => `<option value="${esc(p.pkg)}">${esc(p.pkg)} (${p.counts.pending} pending)</option>`).join('');
  const want = new URLSearchParams(location.search).get('pkg');
  sel.value = (want && pk.some(p => p.pkg === want)) ? want : (pk.find(p => p.counts.pending) || pk[0]).pkg;
  await openPkg(sel.value);
}
async function openPkg(pkg, keepActive) {
  state.pkg = pkg;
  state.data = await api('/api/pkg/' + encodeURIComponent(pkg));
  const opt = [...$('#pkg').options].find(o => o.value === pkg);
  if (opt) opt.textContent = `${pkg} (${state.data.counts.pending} pending)`;
  if (!keepActive || !state.data.claims.some(c => c.id === state.active)) {
    const firstPending = state.data.claims.find(c => c.status === 'pending');
    state.active = (firstPending || state.data.claims[0] || {}).id || null;
  }
  if (!state.file || !state.data.files.includes(state.file)) state.file = state.data.files[0];
  renderAll(true);
}
function counts() {
  const c = state.data.counts;
  const decided = c.approved + c.edited;
  $('#counts').textContent = `${decided} decided, ${c.pending} pending${c.rejected ? ', ' + c.rejected + ' rejected' : ''}`;
  const blocking = state.data.claims.filter(x => x.status === 'pending' || (x.status === 'rejected' && (x.locations || []).length)).length;
  $('#render').disabled = blocking > 0;
  $('#render').title = $('#render').disabled ? 'Resolve every pending claim, and edit any rejected claim out of the documents, first' : 'Render the resume and letter PDFs';
  $('#approveAll').disabled = c.pending === 0;
}
function renderAll(reloadFrame) {
  counts();
  const cur = state.data.claims.find(c => c.id === state.active);
  $('#nodoc').style.display = cur && !(cur.locations || []).length ? 'block' : 'none';
  const list = $('#list');
  list.innerHTML = state.data.claims.map((c, i) => card(c, i)).join('') ||
    '<div class="empty">This package has no claims to review.</div>';
  list.querySelectorAll('.card').forEach(el => el.addEventListener('click', e => {
    if (e.target.closest('button, textarea')) return;
    select(el.dataset.id);
  }));
  list.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); doAct(b.dataset.id, b.dataset.act, b.dataset.loc); }));
  list.querySelectorAll('textarea').forEach(t => t.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); saveEdit(t.dataset.id, t.dataset.loc, t.value); }
    if (e.key === 'Escape') { state.editing = null; renderAll(false); }
  }));
  $('#tabs').innerHTML = state.data.files.map(f => `<div class="tab ${f === state.file ? 'on' : ''}" data-f="${esc(f)}">${f.endsWith('.md') ? 'Cover letter' : 'Resume'}</div>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { state.file = t.dataset.f; renderAll(true); }));
  if (reloadFrame) loadFrame();
  const a = list.querySelector('.card.active'); if (a) a.scrollIntoView({ block: 'nearest' });
  const ta = list.querySelector('textarea'); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}
function card(c, i) {
  const on = c.id === state.active;
  const locs = (c.locations || []).map((l, k) => {
    const editing = state.editing && state.editing.id === c.id && String(state.editing.loc) === String(k);
    const where = (l.file.endsWith('.md') ? 'Cover letter' : 'Resume') + (l.found ? '' : ' <span class="missing">text not found in file</span>');
    return `<div class="loc"><div class="file">${where}</div>` + (editing
      ? `<textarea data-id="${esc(c.id)}" data-loc="${k}">${esc(l.text)}</textarea>
         <div class="actions"><button class="primary" data-act="save" data-id="${esc(c.id)}" data-loc="${k}">Save edit<kbd>Cmd Enter</kbd></button>
         <button data-act="cancel" data-id="${esc(c.id)}">Cancel<kbd>Esc</kbd></button></div>`
      : `<q>${esc(l.text)}</q>` + (on ? ` <button data-act="edit" data-id="${esc(c.id)}" data-loc="${k}">Edit${k === 0 ? '<kbd>E</kbd>' : ''}</button>` : '')) + '</div>';
  }).join('') || `<div class="loc"><div class="file"><span class="nodoc">Not in the resume or letter</span></div>
      <div class="note">This wording was kept out of this package on purpose, so there is nothing to highlight. Approve if it is true and may be used in future packages; reject to keep it out for good.</div></div>`;
  const last = (c.history || []).slice(-1)[0];
  const hist = last ? `<div class="hist">Last: ${esc(last.action)} ${esc(last.at.replace('T', ' '))}${last.note ? ' (' + esc(last.note) + ')' : ''}</div>` : '';
  const btns = on ? `<div class="actions">
      <button class="approve" data-act="approve" data-id="${esc(c.id)}">Approve<kbd>A</kbd></button>
      <button class="reject" data-act="reject" data-id="${esc(c.id)}">Reject<kbd>R</kbd></button>
      ${c.status !== 'pending' ? `<button data-act="reset" data-id="${esc(c.id)}">Back to pending<kbd>U</kbd></button>` : ''}
    </div>` : '';
  return `<div class="card ${on ? 'active' : ''}" data-id="${esc(c.id)}">
    <div class="top"><span class="n">${i + 1}.</span><span class="label">${esc(c.label)}</span><span class="chip ${esc(c.status)}">${esc(c.status)}</span></div>
    ${c.why ? `<div class="why">${esc(c.why)}</div>` : ''}${locs}${btns}${hist}</div>`;
}
function select(id) {
  if (state.active === id && !state.editing) return;
  state.active = id; state.editing = null;
  const c = state.data.claims.find(x => x.id === id);
  const f = c && c.locations && c.locations[0] && c.locations[0].file;
  if (f && f !== state.file) { state.file = f; renderAll(true); }
  else { renderAll(false); highlight(); }
}
function loadFrame() {
  if (!state.file) { $('#frame').removeAttribute('src'); return; }
  $('#frame').src = `/preview/${encodeURIComponent(state.pkg)}/${encodeURIComponent(state.file)}?hl=${encodeURIComponent(state.active || '')}&t=${Date.now()}`;
}
// Line-break check: the preview lays out at the printed width, so a short last line here is a short last line in the PDF.
function checkWraps() {
  const box = $('#wraps'); let d;
  try { d = $('#frame').contentDocument; } catch (e) { return; }
  if (!d || !d.body) return;
  const found = [];
  d.querySelectorAll('li, p, .cert-item, .contact-info, h1').forEach(el => {
    const r = d.createRange(); r.selectNodeContents(el);
    const rects = [...r.getClientRects()].filter(x => x.width > 0);
    if (!rects.length) return;
    const tops = [...new Set(rects.map(x => Math.round(x.top)))].sort((a, b) => a - b);
    const text = el.innerText.trim().replace(/\s+/g, ' ');
    if (el.matches('.contact-info, h1')) { if (tops.length > 1) found.push('Header wraps: ' + text.slice(0, 60)); return; }
    if (tops.length < 2) return;
    const last = rects.filter(x => Math.round(x.top) === tops[tops.length - 1]);
    const w = Math.max(...last.map(x => x.right)) - Math.min(...last.map(x => x.left));
    if (w / el.getBoundingClientRect().width < 0.12) found.push('Short last line: ...' + text.slice(-60));
  });
  box.className = found.length ? 'warn' : 'ok';
  box.innerHTML = found.length
    ? `Line breaks: ${found.length} to look at<ul>${found.map(x => '<li>' + esc(x) + '</li>').join('')}</ul>`
    : 'Line breaks: no stranded words or wrapped headers';
}
$('#frame').addEventListener('load', () => setTimeout(checkWraps, 300));
function highlight() { $('#frame').contentWindow && $('#frame').contentWindow.postMessage({ activate: state.active }, '*'); }
window.addEventListener('message', e => { if (e.data && e.data.claim) select(e.data.claim); });

async function doAct(id, act, loc) {
  if (act === 'edit') { state.active = id; state.editing = { id, loc: loc || 0 }; renderAll(false); return; }
  if (act === 'cancel') { state.editing = null; renderAll(false); return; }
  if (act === 'save') { const t = document.querySelector(`textarea[data-id="${CSS.escape(id)}"]`); return saveEdit(id, loc, t.value); }
  const map = { approve: 'approve', reject: 'reject', reset: 'reset' };
  let note;
  if (act === 'reject') { note = prompt('Why is this claim wrong? (optional; recorded in the checklist history)') || undefined; }
  try {
    await api(`/api/pkg/${encodeURIComponent(state.pkg)}/claim/${encodeURIComponent(id)}`, { action: map[act], note });
    const idx = state.data.claims.findIndex(c => c.id === id);
    await openPkg(state.pkg, true);
    if (act === 'approve') { const next = state.data.claims.slice(idx + 1).find(c => c.status === 'pending') || state.data.claims.find(c => c.status === 'pending'); if (next) select(next.id); }
  } catch (e) { toast(e.message, true); }
}
async function saveEdit(id, loc, text) {
  try {
    await api(`/api/pkg/${encodeURIComponent(state.pkg)}/claim/${encodeURIComponent(id)}`, { action: 'edit', loc: Number(loc || 0), text });
    state.editing = null; await openPkg(state.pkg, true); toast('Edit saved to the source file. Claim marked edited.');
  } catch (e) { toast(e.message, true); }
}
document.addEventListener('keydown', e => {
  if (e.target.closest('textarea, select, input') || e.metaKey || e.ctrlKey || e.altKey || !state.data) return;
  const cl = state.data.claims, i = cl.findIndex(c => c.id === state.active);
  const k = e.key.toLowerCase();
  if (k === 'j' || e.key === 'ArrowDown') { e.preventDefault(); if (i < cl.length - 1) select(cl[i + 1].id); }
  else if (k === 'k' || e.key === 'ArrowUp') { e.preventDefault(); if (i > 0) select(cl[i - 1].id); }
  else if (k === 'a' && state.active) doAct(state.active, 'approve');
  else if (k === 'r' && state.active) doAct(state.active, 'reject');
  else if (k === 'u' && state.active) doAct(state.active, 'reset');
  else if (k === 'e' && state.active && (cl[i].locations || []).length) { e.preventDefault(); doAct(state.active, 'edit', 0); }
});
$('#pkg').addEventListener('change', e => { state.file = null; history.replaceState(null, '', '?pkg=' + e.target.value); openPkg(e.target.value); });
$('#approveAll').addEventListener('click', async () => {
  if (!confirm('Approve every claim still pending, as written?')) return;
  try { await api(`/api/pkg/${encodeURIComponent(state.pkg)}/approve-all`, {}); await openPkg(state.pkg, true); } catch (e) { toast(e.message, true); }
});
$('#render').addEventListener('click', async () => {
  const b = $('#render'); b.disabled = true; b.textContent = 'Rendering...';
  try {
    const r = await api(`/api/pkg/${encodeURIComponent(state.pkg)}/render`, {});
    toast(r.results.map(x => `${x.file}: ${x.pages} page${x.pages === 1 ? '' : 's'}${x.ok ? '' : ' (expected ' + x.expected + ')'}`).join('\n'), !r.results.every(x => x.ok));
  } catch (e) { toast(e.message, true); }
  b.textContent = 'Render PDFs'; await openPkg(state.pkg, true);
});
loadPackages().catch(e => toast(e.message, true));
</script>
</body>
</html>
